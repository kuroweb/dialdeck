name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && (github.actor == 'kuroweb' || github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install review skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh skill install kuroweb/ai-manifest skills/gh-pr-review-ci --agent claude-code --scope user
          gh skill install kuroweb/ai-manifest skills/code-reviewing --agent claude-code --scope user

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]"
          track_progress: true
          prompt: |
            gh-pr-review-ci --pr ${{ github.event.pull_request.number }}
          claude_args: |
            --model sonnet
            --allowedTools "Read,Grep,Glob,Skill(gh-pr-review-ci),Skill(code-reviewing),Bash(gh repo view:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
